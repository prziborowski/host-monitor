# TEMPLATE - edit before applying.
# ConfigMap holds the full host-monitor config (including the Slack token) in the
# simplest mode. The slack.api_key placeholder below can be filled in here, OR
# left blank and supplied via the optional Secret (see secret.yaml).
#
# To generate a real config from your local config/hosts.json, run:
#   scripts/convert-config.sh
# which produces a ConfigMap like this one (and, with --split-secret, moves the
# token into the Secret instead).
apiVersion: v1
kind: ConfigMap
metadata:
  name: host-monitor
  namespace: host-monitor
  labels:
    app: host-monitor
data:
  hosts.json: |
    {
      "hosts": [
        {
          "name": "Web Server 1",
          "ip": "192.168.1.10"
        },
        {
          "name": "Database Server",
          "ip": "192.168.1.20"
        },
        {
          "name": "API Gateway",
          "ip": "192.168.1.30"
        }
      ],
      "slack": {
        "channel": "C0123456789",
        "username": "Server Monitor",
        "icon_emoji": ":robot_face:",
        "api_key": "xoxb-REPLACE-ME",
        "message_ts": ""
      },
      "ping": {
        "timeout_seconds": 3,
        "max_failures": 5,
        "check_interval_seconds": 60
      },
      "status_update": {
        "interval_hours": 1
      }
    }
