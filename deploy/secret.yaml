# OPTIONAL hardening.
# This Secret is only needed to keep the Slack bot token OUT of the ConfigMap.
# In the default/simplest mode the token lives in the ConfigMap (api_key) and
# this file can be ignored.
#
# To use it:
#   1. Replace the placeholder below with your real token (starts with xoxb-).
#   2. Leave slack.api_key BLANK in configmap.yaml.
#   3. Uncomment the SLACK_API_KEY env block in deployment.yaml.
#
#   scripts/convert-config.sh --split-secret can also generate this for you.
apiVersion: v1
kind: Secret
metadata:
  name: host-monitor-secret
  labels:
    app: host-monitor
type: Opaque
stringData:
  slack-api-key: "xoxb-REPLACE-ME-..."
