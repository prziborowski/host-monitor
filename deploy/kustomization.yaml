apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stamp the namespace onto every resource so they land together instead of in
# `default`.
namespace: host-monitor

# Core resources (always applied). The namespace is listed first so it exists
# before the other resources that reference it.
resources:
    - namespace.yaml
    - configmap.yaml
    - deployment.yaml
    # OPTIONAL hardening: apply this to keep the Slack token out of the ConfigMap.
    # Also enable the SLACK_API_KEY env block in deployment.yaml when using this.
    # - secret.yaml

# OPTIONAL: override the image tag/registry without editing deployment.yaml.
# Example:
# images:
#     - name: host-monitor
#       newTag: v1.2.3
#     - name: host-monitor
#       newName: myregistry.example.com/host-monitor
